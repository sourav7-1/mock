<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Escape – Technical Test Suite</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #F3F1EC;
      --paper-2: #E9E6DF;
      --paper-3: #DFDBD2;
      --ink: #15181D;
      --ink-2: #5A606B;
      --rule: #CBD1D8;
      --rule-strong: #A8B2BD;
      --exit: #0A8754;
      --exit-subtle: rgba(10, 135, 84, 0.12);
      --hazard: #C8322A;
      --hazard-subtle: rgba(200, 50, 42, 0.12);
      --route: #1F5FD6;
      --font-sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "IBM Plex Mono", SFMono-Regular, Consolas, Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--paper);
      color: var(--ink);
      line-height: 1.5;
      padding: 32px 20px;
    }
    .test-container {
      max-width: 920px;
      margin: 0 auto;
    }
    .test-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--rule);
    }
    .test-title { font-size: 18px; font-weight: 700; color: var(--ink); letter-spacing: 0.02em; }
    .test-subtitle { font-size: 12px; color: var(--ink-2); font-family: var(--font-mono); margin-top: 4px; }
    .back-link {
      color: var(--ink);
      text-decoration: none;
      font-weight: 500;
      font-size: 13px;
      padding: 6px 12px;
      border: 1px solid var(--rule-strong);
      border-radius: 4px;
      background: var(--paper-2);
      transition: border-color 150ms ease;
    }
    .back-link:hover { border-color: var(--ink); }
    .summary-card {
      display: flex;
      gap: 32px;
      background-color: var(--paper-2);
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }
    .summary-item {
      display: flex;
      flex-direction: column;
    }
    .summary-num {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .summary-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-2);
      font-family: var(--font-mono);
      font-weight: 600;
    }
    .num-pass { color: var(--exit); }
    .num-fail { color: var(--hazard); }
    .num-total { color: var(--route); }

    .suite-card {
      background-color: var(--paper-2);
      border: 1px solid var(--rule);
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .suite-header {
      background-color: var(--paper-3);
      padding: 10px 16px;
      font-weight: 600;
      font-size: 12px;
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--rule);
      color: var(--ink);
    }
    .test-list { list-style: none; }
    .test-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--rule);
      font-size: 13px;
    }
    .test-item:last-child { border-bottom: none; }
    .test-name { font-weight: 500; color: var(--ink); }
    .badge {
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 11px;
      font-family: var(--font-mono);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge-pass { background-color: var(--exit-subtle); color: var(--exit); border: 1px solid var(--exit); }
    .badge-fail { background-color: var(--hazard-subtle); color: var(--hazard); border: 1px solid var(--hazard); }
    .error-details {
      margin-top: 6px;
      padding: 6px 10px;
      background: var(--hazard-subtle);
      border-left: 3px solid var(--hazard);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--hazard);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <header class="test-header">
      <div>
        <h1 class="test-title">SMART ESCAPE · ROUTER & VALIDATOR TEST SUITE</h1>
        <p class="test-subtitle">Automated verification for Dijkstra dual-distance, lexicographic tie-breaking, and schema rules</p>
      </div>
      <a href="../index.html" class="back-link">← Return to Blueprint</a>
    </header>

    <div class="summary-card">
      <div class="summary-item">
        <span id="numTotal" class="summary-num num-total">–</span>
        <span class="summary-label">Total Tests</span>
      </div>
      <div class="summary-item">
        <span id="numPass" class="summary-num num-pass">–</span>
        <span class="summary-label">Passed</span>
      </div>
      <div class="summary-item">
        <span id="numFail" class="summary-num num-fail">–</span>
        <span class="summary-label">Failed</span>
      </div>
    </div>

    <div id="suitesContainer">
      <p style="padding: 20px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-2);">Running test suites...</p>
    </div>
  </div>

  <script type="module">
    import { registerTests } from "./tests.js";

    async function run() {
      const runner = registerTests();
      const results = await runner.runAll();

      const numTotal = document.getElementById("numTotal");
      const numPass = document.getElementById("numPass");
      const numFail = document.getElementById("numFail");
      const container = document.getElementById("suitesContainer");

      const passed = results.filter(r => r.passed).length;
      const failed = results.filter(r => !r.passed).length;

      numTotal.textContent = results.length;
      numPass.textContent = passed;
      numFail.textContent = failed;

      const suites = {};
      results.forEach(r => {
        if (!suites[r.suite]) suites[r.suite] = [];
        suites[r.suite].push(r);
      });

      container.innerHTML = "";
      for (const [suiteName, tests] of Object.entries(suites)) {
        const suiteEl = document.createElement("div");
        suiteEl.className = "suite-card";

        const suiteHeader = document.createElement("div");
        suiteHeader.className = "suite-header";
        suiteHeader.textContent = suiteName;
        suiteEl.appendChild(suiteHeader);

        const list = document.createElement("ul");
        list.className = "test-list";

        tests.forEach(t => {
          const li = document.createElement("li");
          li.className = "test-item";

          const nameDiv = document.createElement("div");
          nameDiv.className = "test-name";
          nameDiv.textContent = t.name;

          if (!t.passed && t.error) {
            const errDiv = document.createElement("div");
            errDiv.className = "error-details";
            errDiv.textContent = t.error;
            nameDiv.appendChild(errDiv);
          }

          const badge = document.createElement("span");
          badge.className = t.passed ? "badge badge-pass" : "badge badge-fail";
          badge.textContent = t.passed ? "PASS" : "FAIL";

          li.appendChild(nameDiv);
          li.appendChild(badge);
          list.appendChild(li);
        });

        suiteEl.appendChild(list);
        container.appendChild(suiteEl);
      }
    }

    run();
  </script>
</body>
</html>
